[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fanta"
version = "0.1.0"
description = "Fantasy football (Serie A) decision support: rules engine, projections and auction price list"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "numpy",
    "openpyxl",
    "soccerdata",
]

[project.optional-dependencies]
dev = ["pytest"]

# I pacchetti del progetto. Installazione editable: `pip install -e .`
# Dopo di che `import rules`, `import ingest`, `import value` funzionano da
# qualunque cartella e con qualunque forma di lancio (python value/listino.py,
# python -m value.listino, dentro i test), senza trucchi sul path.
[tool.setuptools]
packages = ["rules", "ingest", "value"]
